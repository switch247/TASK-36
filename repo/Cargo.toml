[workspace]
members = [
  "backend",
  "frontend",
  "app/core",
  "app/models",
  "app/api/v1",
  "app/services"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Eagle Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rocket = { version = "0.5.1", features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "chrono", "macros", "migrate", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
regex = "1"
strsim = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
getrandom = { version = "0.2", features = ["js"] }
