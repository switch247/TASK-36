services:
  db:
    image: mysql:8.0
    container_name: eagle_db
    restart: unless-stopped
    # Binary logging is on by default in mysql:8.0. Without this flag, creating
    # a trigger or stored function as a non-SUPER user (our `eagle` test user)
    # fails with error 1419. Trusting function creators is standard for
    # integration-test databases where every schema object is under repo
    # control and reviewed in PRs.
    command:
      - mysqld
      - --log-bin-trust-function-creators=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eagle_exam}
      MYSQL_USER: ${MYSQL_USER:-eagle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_user_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./app/models/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-eagle}", "-p${MYSQL_PASSWORD:-change_this_user_password}"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 6m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eagle_app
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eagle_exam}
      MYSQL_USER: ${MYSQL_USER:-eagle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_user_password}
      DATABASE_URL: mysql://${MYSQL_USER:-eagle}:${MYSQL_PASSWORD:-change_this_user_password}@db:3306/${MYSQL_DATABASE:-eagle_exam}
      JWT_SECRET: ${JWT_SECRET:-replace_with_long_random_secret}
      AES_KEY_BASE64: ${AES_KEY_BASE64:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      ROCKET_CORS_ORIGINS: ${ROCKET_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://frontend:8080}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eagle_frontend
    depends_on:
      app:
        condition: service_started
    environment:
      API_BASE: ${API_BASE:-http://localhost:8001/api/v1}
    ports:
      - "8080:80"
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eagle_seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eagle_exam}
      MYSQL_USER: ${MYSQL_USER:-eagle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_user_password}
      DATABASE_URL: mysql://${MYSQL_USER:-eagle}:${MYSQL_PASSWORD:-change_this_user_password}@db:3306/${MYSQL_DATABASE:-eagle_exam}
      JWT_SECRET: ${JWT_SECRET:-replace_with_long_random_secret}
      AES_KEY_BASE64: ${AES_KEY_BASE64:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
    command: ["/app/seed"]
    restart: "no"

volumes:
  db_data:
